<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Private preview: apply the stored theme before any stylesheet can paint. */
      (function () {
        var root = document.documentElement, key = 'anhv-theme', theme = 'dark';
        var query = new URLSearchParams(location.search).get('theme');
        try {
          if (query === 'reset') localStorage.removeItem(key);
          else if (query === 'light' || query === 'dark') localStorage.setItem(key, query);
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (query === 'light' || query === 'dark') theme = query;
        if (query === 'reset') theme = 'dark';
        root.dataset.theme = theme;
        function sync() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
          meta.content = getComputedStyle(root).getPropertyValue('--bg').trim();
        }
        window.__anhvThemeSync = sync;
        document.addEventListener('keydown', function (e) {
          var el = e.target;
          if (!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.defaultPrevented || e.key.toLowerCase() !== 'l') return;
          if (el && (el.closest('input, textarea, select') || el.isContentEditable)) return;
          var next = root.dataset.theme === 'light' ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem(key, next); } catch (err) {}
          sync(); document.dispatchEvent(new CustomEvent('anhv-theme', { detail: next }));
          e.preventDefault();
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script>window.__anhvThemeSync(); delete window.__anhvThemeSync;</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="This page does not exist." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Page not found | Anh V</title>
    <link rel="preload" href="/fonts/ClashDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Clash Display'; src: url('/fonts/ClashDisplay-Variable.woff2') format('woff2'); font-weight: 200 700; font-style: normal; font-display: swap; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body { font-family: 'Clash Display', system-ui, sans-serif; }
      main { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 3.125vw 3.2vh; }
      h1 { margin: 0; font-weight: 500; font-size: clamp(5rem, 24vw, 30rem); line-height: 0.8; letter-spacing: -0.01em; }
      p { margin: 2.4vh 0 0; font-size: clamp(0.75rem, 0.833vw, 1.25rem); line-height: 1.8; opacity: 0.6; }
      a { color: var(--ink); text-decoration: none; opacity: 1; border-bottom: 1px solid #f04a0e; }
      a:hover { color: #f04a0e; }
      a:focus-visible { outline: 2px solid #f04a0e; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page does not exist. <a href="/">Back to the home page</a></p>
    </main>
  </body>
</html>
