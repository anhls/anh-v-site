      /* R25: hand-off from the Work page / homepage: paint the enlarged picture from the first frame (removed by src/project.js once the header image is ready) */
      (function () {
        try {
          var d = JSON.parse(sessionStorage.getItem('pxt') || 'null'); sessionStorage.removeItem('pxt');
          if (!d || Date.now() - d.t > 15000 || location.pathname.indexOf('/' + d.slug + '.html') < 0) return;
          window.__pxt = d;
          document.body.insertAdjacentHTML('afterbegin', '<div id="pxt" aria-hidden="true" style="position:fixed;inset:0;z-index:8;background:#000;overflow:hidden"><img alt="" decoding="sync" src="' + d.src + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></div>');
        } catch (e) {}
      })();
    </script>
