<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Private preview: apply the stored theme before any stylesheet can paint. */
      (function () {
        var root = document.documentElement, key = 'anhv-theme', theme = 'dark';
        var query = new URLSearchParams(location.search).get('theme');
        try {
          if (query === 'reset') localStorage.removeItem(key);
          else if (query === 'light' || query === 'dark') localStorage.setItem(key, query);
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (query === 'light' || query === 'dark') theme = query;
        if (query === 'reset') theme = 'dark';
        root.dataset.theme = theme;
        function sync() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
          meta.content = getComputedStyle(root).getPropertyValue('--bg').trim();
        }
        window.__anhvThemeSync = sync;
        document.addEventListener('keydown', function (e) {
          var el = e.target;
          if (!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.defaultPrevented || e.key.toLowerCase() !== 'l') return;
          if (el && (el.closest('input, textarea, select') || el.isContentEditable)) return;
          var next = root.dataset.theme === 'light' ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem(key, next); } catch (err) {}
          sync(); document.dispatchEvent(new CustomEvent('anhv-theme', { detail: next }));
          e.preventDefault();
        });
      })();
    </script>

    <script>
      /* R25: hand-off from the Work page / homepage: paint the enlarged picture from the first frame (removed by src/project.js once the header image is ready) */
      (function () {
        try {
          var d = JSON.parse(sessionStorage.getItem('pxt') || 'null'); sessionStorage.removeItem('pxt');
          if (!d || Date.now() - d.t > 15000 || !new RegExp('/' + d.slug + '(?:\\.html)?/?$').test(location.pathname)) return;
          window.__pxt = d;
          document.body.insertAdjacentHTML('afterbegin', '<div id="pxt" aria-hidden="true" style="position:fixed;inset:0;z-index:8;background:var(--bg);overflow:hidden"><img alt="" decoding="sync" src="' + d.src + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></div>');
          if (d.flight && Number.isFinite(d.flight.t0) && d.flight.tail > 0 && d.flight.zStart > 0 && d.flight.zStart <= 1) {
            // R37e shared curve: keep verbatim with flight-curve.js (verified by the capture check).
            function flightZoom(flight, now) {
  var u = Math.max(0, Math.min(1, (now - flight.t0 - flight.land * 1000) / (flight.tail * 1000)));
  return flight.zStart + (1 - flight.zStart) * (1 - Math.pow(1 - u, 3));
}
            if (d.flight.wordmark) {
              var mark = document.createElement('div'), logo = document.createElement('img');
              mark.id = 'pxt-wordmark'; mark.className = 'wordmark'; mark.style.cssText = d.flight.wordmark.style;
              logo.src = d.flight.wordmark.src; logo.alt = ''; mark.appendChild(logo); document.body.appendChild(mark);
            }
            var overlay = document.getElementById('pxt'), image = overlay.querySelector('img');
            var edge = image.cloneNode(); overlay.prepend(edge); image.style.zIndex = '1';
            window.__pxtFlightDone = new Promise(function (resolve) {
              var frame = 0;
              function paint() {
                image.style.transform = 'scale(' + flightZoom(d.flight, Date.now()) + ')';
                if (Date.now() >= d.flight.t0 + (d.flight.land + d.flight.tail) * 1000) { resolve(); return; }
                frame = requestAnimationFrame(paint);
              }
              paint();
              addEventListener('pagehide', function () { cancelAnimationFrame(frame); resolve(); }, {once:true});
            });
          }
        } catch (e) {}
      })();
    </script>
