<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @view-transition { navigation: auto; }
      ::view-transition-group(root) { animation: none; }
      ::view-transition-old(root) { animation: none; opacity: 1; }
      ::view-transition-new(root) { animation: none; opacity: 1; }
    </style>
    <script>
      /* Private preview: apply the stored theme before any stylesheet can paint. */
      (function () {
        var root = document.documentElement, key = 'anhv-theme', theme = 'dark';
        var query = new URLSearchParams(location.search).get('theme');
        try {
          if (query === 'reset') localStorage.removeItem(key);
          else if (query === 'light' || query === 'dark') localStorage.setItem(key, query);
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (query === 'light' || query === 'dark') theme = query;
        if (query === 'reset') theme = 'dark';
        root.dataset.theme = theme;
        function sync() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
          meta.content = getComputedStyle(root).getPropertyValue('--bg').trim();
        }
        window.__anhvThemeSync = sync;
        document.addEventListener('keydown', function (e) {
          var el = e.target;
          if (!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.defaultPrevented || e.key.toLowerCase() !== 'l') return;
          if (el && (el.closest('input, textarea, select') || el.isContentEditable)) return;
          var next = root.dataset.theme === 'light' ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem(key, next); } catch (err) {}
          sync(); document.dispatchEvent(new CustomEvent('anhv-theme', { detail: next }));
          e.preventDefault();
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script>window.__anhvThemeSync(); delete window.__anhvThemeSync;</script>

  <body class="work-page">
    <script>
      /* R28: the way back from a project entered through the R25 transition: paint the header (as it was left) over black from the first frame; work.js plays the shrink */
      (function () {
        try {
          var r = JSON.parse(sessionStorage.getItem('pxb') || 'null');
          if (!r || r.origin !== 'work' || !r.leave || Date.now() - r.t > 60000 || /[?&]gl=0/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          var L = r.leave, ok = L.mode === 'shrink' && L.W === innerWidth && L.H === innerHeight, s = L.sec, i = L.img;
          var h = '<div id="pxb" aria-hidden="true" style="position:fixed;inset:0;z-index:8;overflow:hidden"><div class="px__bg" style="position:absolute;inset:0;background:var(--bg);opacity:' + (ok && typeof r.blackMax === 'number' ? r.blackMax : 1) + '"></div>';
          if (ok) h += '<div class="px__box" style="position:absolute;overflow:hidden;left:' + s[0] + 'px;top:' + s[1] + 'px;width:' + s[2] + 'px;height:' + s[3] + 'px"><img alt="" decoding="sync" src="' + r.src + '" style="position:absolute;left:' + (i[0] - s[0]) + 'px;top:' + (i[1] - s[1]) + 'px;width:' + i[2] + 'px;height:' + i[3] + 'px;object-fit:cover;display:block"></div>';
          document.body.insertAdjacentHTML('afterbegin', h + '</div>');
        } catch (e) {}
      })();
    </script>
    <script>
      /* R45 / R45c: arriving from the homepage flight: paint the landed cards (the first card + the neighbours it revealed, same rects and files as the strip) and the small wordmark on the page colour
         from the FIRST frame; src/work/home-return.js fades the layer out once the live strip has drawn. The record is read when the page is ACTIVATED: a prerendered page (the homepage asks Chrome to
         prerender /work/) runs this script long before the click, so it paints at the 'prerenderingchange' event, which fires before the first frame of the activated page. */
      (function () {
        function paint() {
          try {
            if (document.getElementById('pxh')) return;
            var r = JSON.parse(localStorage.getItem('pxh') || 'null');
            if (/[?&]debug=handoff/.test(location.search)) localStorage.setItem('dbg-handoff', '1'); if (/[?&]debug=off/.test(location.search)) localStorage.removeItem('dbg-handoff');
            if (localStorage.getItem('dbg-handoff') === '1') console.log('[handoff] work paint(): prerendering', document.prerendering, 'record', r ? 'age ' + (Date.now() - r.t) + 'ms' : 'none');
            if (!r || Date.now() - r.t > 10000 || r.W !== innerWidth || r.H !== innerHeight || /[?&]gl=0/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (r) localStorage.removeItem('pxh'); return; }
            localStorage.removeItem('pxh');
            var box = function (c, src) { return '<div class="px__box" style="position:absolute;overflow:hidden;left:' + c[0] + 'px;top:' + c[1] + 'px;width:' + c[2] + 'px;height:' + c[3] + 'px"><img alt="" decoding="sync" src="' + src + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></div>'; };
            var h = '<div id="pxh" aria-hidden="true" style="position:fixed;inset:0;z-index:8;overflow:hidden"><div class="px__bg" style="position:absolute;inset:0;background:var(--bg)"></div>';
            (r.cards || []).forEach(function (c) { h += box(c.rect, c.src); });
            h += box(r.rect, r.src) + '</div>';
            if (r.wm) h += '<a id="pxh-wm" aria-hidden="true" tabindex="-1" style="' + r.wm.style + '"><img alt="" src="' + r.wm.src + '" style="width:100%;height:100%;display:block"></a>';
            document.body.insertAdjacentHTML('afterbegin', h);
          } catch (e) {}
        }
        window.__paintPxh = paint;
        if (document.prerendering) document.addEventListener('prerenderingchange', paint, { once: true }); else paint();
      })();
    </script>
    <a class="skip" href="#app">Skip to content</a>
    <main id="app" tabindex="-1"></main>
    <script type="module" src="/src/work.js"></script>
  </body>
