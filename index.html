<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      /* Private preview: apply the stored theme before any stylesheet can paint. */
      (function () {
        var root = document.documentElement, key = 'anhv-theme', theme = 'dark';
        var query = new URLSearchParams(location.search).get('theme');
        try {
          if (query === 'reset') localStorage.removeItem(key);
          else if (query === 'light' || query === 'dark') localStorage.setItem(key, query);
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (query === 'light' || query === 'dark') theme = query;
        if (query === 'reset') theme = 'dark';
        root.dataset.theme = theme;
        function sync() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
          meta.content = getComputedStyle(root).getPropertyValue('--bg').trim();
        }
        window.__anhvThemeSync = sync;
        document.addEventListener('keydown', function (e) {
          var el = e.target;
          if (!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.defaultPrevented || e.key.toLowerCase() !== 'l') return;
          if (el && (el.closest('input, textarea, select') || el.isContentEditable)) return;
          var next = root.dataset.theme === 'light' ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem(key, next); } catch (err) {}
          sync(); document.dispatchEvent(new CustomEvent('anhv-theme', { detail: next }));
          e.preventDefault();
        });
      })();
    </script>

    <script>
      /* R45 / R45c: arriving from the Work page (flight, wordmark, Back, or a plain reload of this page after it): paint the hero frame full screen from the first frame; src/main.js skips the loader
         and fades this layer once the hero video plays. The record is read at ACTIVATION too (a prerendered homepage runs this script before the click). */
      (function () {
        function paint() {
          try {
            if (document.getElementById('pxg')) return;
            var r = JSON.parse(localStorage.getItem('pxg') || 'null');
            if (!r || Date.now() - r.t > 60000 || /[?&](gl=0|home=full)/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (r) localStorage.removeItem('pxg'); return; }
            var f = localStorage.getItem('pxhf') || '/media/hero/poster.webp';
            document.documentElement.classList.add('pxg-on');
            document.body.insertAdjacentHTML('afterbegin', '<div id="pxg" aria-hidden="true" style="position:fixed;inset:0;z-index:8;background:var(--bg);overflow:hidden"><img alt="" decoding="sync" src="' + f + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></div>');
          } catch (e) {}
        }
        window.__paintPxg = paint;
        if (document.prerendering) document.addEventListener('prerenderingchange', paint, { once: true }); else paint();
      })();
    </script>
