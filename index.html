<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* R45c3: cross-document View Transition with NO visible animation: Chrome keeps this page's last frame (the flight's end) on screen until the Work page is ready to paint */
      @view-transition { navigation: auto; }
      ::view-transition-group(root) { animation: none; }
      ::view-transition-old(root) { animation: none; opacity: 1; }
      ::view-transition-new(root) { animation: none; opacity: 1; }
      /* R45b: the way back (Work -> Home), same rule as the Work page: the view transition HOLDS the Work page's last flight frame until the hero video plays (arriveFromWork calls skipTransition()); 1.5 s is only the cap */
      @keyframes r45-old { from, to { opacity: 1; } }
      @keyframes r45-new { from, to { opacity: 0; } }
      html.r45-hold::view-transition-old(root) { animation: r45-old 1.5s linear both; }
      html.r45-hold::view-transition-new(root) { animation: r45-new 1.5s linear both; }
    </style>
    <script>
      addEventListener('pagereveal', function (e) {
        try {
          if (!e.viewTransition || !document.getElementById('pxg')) return;
          document.documentElement.classList.add('r45-hold');
          window.__r45vt = e.viewTransition;
          e.viewTransition.finished.finally(function () { document.documentElement.classList.remove('r45-hold'); });
        } catch (err) {}
      });
    </script>
    <!-- R45c3: render-block the first paint until the hand-off layer (#pxg, painted by the inline script at the start of <body>) is in the DOM, so the first frame IS the hero layer, never the bare page (Chrome 124+; a page without a layer is unblocked when parsing ends) -->
    <link rel="expect" href="#pxg" blocking="render" />
    <script>
      /* Private preview: apply the stored theme before any stylesheet can paint. */
      (function () {
        var root = document.documentElement, key = 'anhv-theme', theme = 'dark';
        var query = new URLSearchParams(location.search).get('theme');
        try {
          if (query === 'reset') localStorage.removeItem(key);
          else if (query === 'light' || query === 'dark') localStorage.setItem(key, query);
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (query === 'light' || query === 'dark') theme = query;
        if (query === 'reset') theme = 'dark';
        root.dataset.theme = theme;
        function sync() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
          meta.content = getComputedStyle(root).getPropertyValue('--bg').trim();
        }
        window.__anhvThemeSync = sync;
        document.addEventListener('keydown', function (e) {
          var el = e.target;
          if (!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.defaultPrevented || e.key.toLowerCase() !== 'l') return;
          if (el && (el.closest('input, textarea, select') || el.isContentEditable)) return;
          var next = root.dataset.theme === 'light' ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem(key, next); } catch (err) {}
          sync(); document.dispatchEvent(new CustomEvent('anhv-theme', { detail: next }));
          e.preventDefault();
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/desktop.css" />
    <script>window.__anhvThemeSync(); delete window.__anhvThemeSync;</script>

  <body>
    <script>
      /* R45 / R45c: arriving from the Work page (flight, wordmark, Back, or a plain reload of this page after it): paint the hero frame full screen from the first frame; src/main.js skips the loader
         and fades this layer once the hero video plays. The record is read at ACTIVATION too (a prerendered homepage runs this script before the click). */
      (function () {
        var D = false; try { if (/[?&]debug=handoff/.test(location.search)) localStorage.setItem('dbg-handoff', '1'); if (/[?&]debug=off/.test(location.search)) localStorage.removeItem('dbg-handoff'); D = localStorage.getItem('dbg-handoff') === '1'; } catch (e) {}
        var log = function () { if (D) console.log.apply(console, ['[handoff]', Math.round(performance.now()) + 'ms'].concat([].slice.call(arguments))); };
        function paint() {
          try {
            if (document.getElementById('pxg')) return;
            var r = JSON.parse(localStorage.getItem('pxg') || 'null');
            log('home paint(): prerendering', document.prerendering, 'record', r ? 'age ' + (Date.now() - r.t) + 'ms' : 'none');
            if (!r || Date.now() - r.t > 60000 || /[?&](gl=0|home=full)/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (r) localStorage.removeItem('pxg'); return; }
            localStorage.removeItem('pxg'); log('home paint(): record valid, deleted, layer up');
            var f = (Date.now() - +localStorage.getItem('pxhft') < 10000 && localStorage.getItem('pxhf')) || '/media/hero/poster.webp';
            localStorage.removeItem('pxhf'); localStorage.removeItem('pxhft');
            document.documentElement.classList.add('pxg-on');
            document.body.insertAdjacentHTML('afterbegin', '<div id="pxg" aria-hidden="true" style="position:fixed;inset:0;z-index:8;background:' + (r.dim < 1 ? '#000' : 'var(--bg)') + ';overflow:hidden"><img alt="" decoding="sync" src="' + f + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:' + (r.dim < 1 ? r.dim : 1) + '"></div>');
          } catch (e) {}
        }
        window.__paintPxg = paint;
        if (document.prerendering) document.addEventListener('prerenderingchange', function () { log('home prerenderingchange (inline)'); paint(); }, { once: true }); else paint();
      })();
    </script>
